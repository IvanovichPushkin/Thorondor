<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Argus - Multi-Camera Detection</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/app.css" />
  </head>
  <body data-default-cam="{{ default_cam }}">
    <div class="container">
      <div class="video">
        <h2>
          Live Multi-Camera
          <span id="status">REC</span>
          <span
            id="webrtcStatus"
            style="font-size: 0.6em; color: #666; margin-left: 10px"
          >
            connecting...
          </span>
        </h2>

        <div class="camera-buttons">
          {% for cam in cams %}
          <button class="btn cam-btn" onclick="switchCam('{{ cam }}')">
            {{ cam }}
          </button>
          {% endfor %}
        </div>

        <div class="overlay">
          <button id="startB" class="btn rec-btn" onclick="doRec('start')">
            RECORD VIDEO
          </button>
          <button id="stopB" class="btn stop-btn" onclick="doRec('stop')">
            STOP VIDEO
          </button>
          <br style="width: 100%" />
          <button
            id="startLogB"
            class="btn log-rec-btn"
            onclick="doLogRec('start')"
          >
            RECORD LOG
          </button>
          <button
            id="stopLogB"
            class="btn log-stop-btn"
            onclick="doLogRec('stop')"
          >
            STOP LOG
          </button>
        </div>

        <div id="progress"><div id="progressBar"></div></div>
        <div id="progressText">0%</div>
        <div id="saveWarning">SAVING VIDEO - DO NOT CLOSE APP</div>

        <video
          id="videoStream"
          autoplay
          playsinline
          muted
          style="width: 100%; height: auto"
        ></video>
      </div>

      <div class="log">
        <h2>
          Live Detection Log
          <span id="logStatus" style="display: none">REC</span>
        </h2>
        <div id="log"></div>
      </div>
    </div>
    <script src="/static/scripts/app.js"></script>
  </body>
</html>
